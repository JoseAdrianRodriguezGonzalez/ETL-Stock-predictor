[project]
name = "training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JoseAdrianRodriguezGonzalez", email = "kerpardor@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mlflow>=3.18.0",
    "optuna>=5.0.0",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
training = "training:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
