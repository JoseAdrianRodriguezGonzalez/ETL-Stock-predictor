

experiment:
  name: rnn_lstm_random_search
  seed: 42

search:
  base_config: configs/lstm.yaml
  strategy: random
  seed: 42
  n_trials_per_model: 20
  metric: val_mse
  direction: minimize

  models:
    - rnn
    - lstm

  space:
    hidden_size: [32, 64, 128,256]
    num_layers: [1, 2,3]
    dropout: [0.0, 0.2]
    learning_rate: [0.001, 0.0005,0.00001]
    batch_size: [32, 64]
    weight_decay: [0.00001, 0.0001]

  model_specific:
    rnn:
      nonlinearity: [tanh, relu]

tracking:
  enabled: true
  experiment_name: sp500_forecasting
  register_model: false
deployment:
  alias: champion
  model_name: sp500_forecasting

  model_repository: deployment/model_repository
  artifact_directory: deployment/assets

  scaler_artifact_path: outputs/preprocessing/scaler.joblib

  opset_version: 17

