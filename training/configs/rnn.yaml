

experiment:
  name: rnn_baseline
  seed: 42
tracking:
  enabled: true
  experiment_name: sp500_forecasting
  register_model: false
  registered_model_name: sp500_forecasting
data:
  path: data/processed/sp500/historical.parquet
  symbol: "^GSPC"
  sequence_length: 30
  batch_size: 32

model:
  name: rnn
  params:
    input_size: 6
    hidden_size: 32
    num_layers: 1
    output_size: 1
    dropout: 0.0

training:
  epochs: 100
  device: auto
  loss: mse

  optimizer:
    name: adam
    params:
      lr: 0.001
      weight_decay: 0.00001

  scheduler:
    name: reduce_on_plateau
    params:
      mode: min
      factor: 0.5
      patience: 3
      min_lr: 0.000001

  early_stopping:
    patience: 7
    min_delta: 0.000001

checkpoint:
  directory: artifacts/checkpoints
  filename: rnn_best.pth
