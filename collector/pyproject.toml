[project]
name = "collector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JoseAdrianRodriguezGonzalez", email = "kerpardor@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pymongo>=4.19.0",
]

[project.scripts]
collector = "collector:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
