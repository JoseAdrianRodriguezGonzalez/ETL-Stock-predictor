name: sp500-platform
services:
  mongodb:
    image: mongo:8.0
    container_name: sp500-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-market_data}

    ports:
      - "${MONGO_HOST}:${MONGO_PORT:-27017}:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - sp500-network

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  collector:
    build:
      context: ..
      dockerfile: collector/Dockerfile

    container_name: sp500-collector
    profiles: ["jobs"]
    restart: "no"
    working_dir: /app

    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROJECT_ROOT: /app
      FMP_API_KEY: ${FMP_API_KEY:?FMP_API_KEY is required}
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-market_data}?authSource=admin

    volumes:
      - ../data:/app/data
      - ../.dvc:/app/.dvc
      - ../../dvc-storage:/dvc-storage
      - ../.git:/app/.git
      - ../.gitignore:/app/.gitignore

    networks:
      - sp500-network

    depends_on:
      mongodb:
        condition: service_healthy
  
  training:
    build:
      context: ..
      dockerfile: training/Dockerfile

    container_name: sp500-training
    profiles: ["jobs"]
    restart: "no"
    working_dir: /app

    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROJECT_ROOT: /app
      MLFLOW_TRACKING_URI: http://mlflow:5000
    devices:
      - nvidia.com/gpu=all
    volumes:
      # Dataset versionado por DVC: solo lectura
      - ../data:/app/data:ro

      # Artefactos generados durante entrenamiento
      - ../artifacts:/app/artifacts

      # Configuraciones disponibles sin reconstruir la imagen
      - ../training/configs:/app/configs:ro
      - ../deployment/model_repository:/app/deployment/model_repository
      - ../deployment/assets:/app/deployment/assets

    networks:
      - sp500-network
    depends_on:
      mlflow:
        condition: service_healthy
  

  mlflow-db:
    image: postgres:16-alpine
    container_name: sp500-mlflow-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${MLFLOW_DB_NAME:-mlflow}
      POSTGRES_USER: ${MLFLOW_DB_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:?MLFLOW_DB_PASSWORD is required}

    volumes:
      - mlflow_db_data:/var/lib/postgresql/data

    networks:
      - sp500-network

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${MLFLOW_DB_USER:-mlflow} -d ${MLFLOW_DB_NAME:-mlflow}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mlflow:
    build:
      context: ..
      dockerfile: mlflow/Dockerfile
      args:
        MLFLOW_VERSION: ${MLFLOW_VERSION:-3.18.0}

    container_name: sp500-mlflow
    restart: unless-stopped
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:*,127.0.0.1:*"
    command:
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg2://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD}@mlflow-db:5432/${MLFLOW_DB_NAME:-mlflow}
      - --artifacts-destination
      - /mlartifacts

    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"

    volumes:
      - mlflow_artifacts:/mlartifacts

    networks:
      - sp500-network

    depends_on:
      mlflow-db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  triton:
    image: nvcr.io/nvidia/tritonserver:25.08-py3
    container_name: sp500-triton
    restart: unless-stopped

    command:
      - tritonserver
      - --model-repository=/models
      - --model-control-mode=poll
      - --repository-poll-secs=30

    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"

    volumes:
      - ../deployment/model_repository:/models:ro

    devices:
      - "nvidia.com/gpu=all"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
networks:
  sp500-network:
    name: sp500-network
    driver: bridge

volumes:
  mongodb_data:
    name: sp500-mongodb-data
  mlflow_db_data:
  mlflow_artifacts:
