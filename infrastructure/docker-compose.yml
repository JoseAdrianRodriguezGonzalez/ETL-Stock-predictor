name: sp500-platform
services:
  mongodb:
    image: mongo:8.0
    container_name: sp500-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-market_data}

    ports:
      - "${MONGO_HOST}:${MONGO_PORT:-27017}:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - sp500-network

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  collector:
    build:
      context: ..
      dockerfile: collector/Dockerfile

    container_name: sp500-collector
    profiles: ["jobs"]
    restart: "no"
    working_dir: /app

    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROJECT_ROOT: /app
      FMP_API_KEY: ${FMP_API_KEY:?FMP_API_KEY is required}
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-market_data}?authSource=admin

    volumes:
      - ../data:/app/data
      - ../.dvc:/app/.dvc
      - ../../dvc-storage:/dvc-storage
      - ../.git:/app/.git
      - ../.gitignore:/app/.gitignore

    networks:
      - sp500-network

    depends_on:
      mongodb:
        condition: service_healthy

networks:
  sp500-network:
    name: sp500-network
    driver: bridge

volumes:
  mongodb_data:
    name: sp500-mongodb-data
